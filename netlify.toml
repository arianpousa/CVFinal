# netlify.toml: Smart Document Scanner (netlify-deployer, Piper). Static site, no build step.
# Docs: https://docs.netlify.com/build/configure-builds/file-based-configuration/
#       https://docs.netlify.com/manage/routing/headers/
# Built from the tested knowledge/netlify-deployer/examples/netlify.toml (validate_config.py 6/6).

[build]
  publish = "."     # the repo root is the site
  command = ""      # no build step, no functions, no environment variables, no API keys

# Pinned, self-hosted OpenCV.js (10.4 MB, Wasm embedded): cache for a year.
# Upgrading OpenCV = a NEW file name (vendor/opencv-<version>.js), which busts the cache.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Only used if a split opencv.js + .wasm build is ever vendored: instantiateStreaming needs this MIME type.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# Site-wide security and permission headers. HTML, JS and CSS keep Netlify's default
# "public, max-age=0, must-revalidate", so every deploy is picked up on the next load.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
